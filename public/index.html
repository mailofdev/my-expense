<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/glow_money-logo.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e8" />
    <meta name="description" content="Glow Money — Track, manage and grow your money. Wallet tracker, budget manager, expense analyzer for India." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Glow Money" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Glow Money — Track • Manage • Grow</title>
    <script>
      (function () {
        try {
          if (localStorage.getItem('glow_money_theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            var theme = document.querySelector('meta[name="theme-color"]');
            if (theme) theme.setAttribute('content', '#070b09');
            var apple = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
            if (apple) apple.setAttribute('content', 'black-translucent');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Glow Money.</noscript>
    <div id="root"></div>
  </body>
</html>
